[package]
name = "flite-rs"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
description = "Small, fast, text to speech. A clean-room Rust implementation of the Flite and Festival diphone synthesis techniques, bit-identical to upstream Flite."
homepage = "https://github.com/GabrielVicini/flite-rs"
repository = "https://github.com/GabrielVicini/flite-rs"
readme = "README.md"
keywords = ["tts", "speech", "synthesis", "audio", "diphone"]
categories = ["multimedia::audio", "text-processing"]
# The browser demo and its wasm front-end are built from this repository
# but are not part of the library, and the packaged crate is already close
# enough to the registry size limit to care.
exclude = ["/web", "/wasm", "/.github"]

[lib]
name = "flite_rs"
path = "src/lib.rs"

[[bin]]
name = "flite-rs"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The CLI front-end; without it the library builds with zero dependencies.
cli = ["dep:clap"]
# The cmu_us_kal16 voice: the same speaker at 16 kHz, and a clear improvement
# in quality. Off by default because its residual is not compressed, so it adds
# about 4 MB to the binary.
kal16 = []
# Clustergen: statistical parametric synthesis, and the cmu_us_slt voice that
# uses it. Off by default because the regression trees and the parameter store
# add several megabytes, and because a build that only wants diphone should
# compile none of the MLSA/MLPG code. Adds no dependencies.
clustergen = []

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

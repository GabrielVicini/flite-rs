<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>flite-rs</title>
    <meta name="description" content="Speech synthesis compiled to WebAssembly. Nothing is uploaded; the voice is in the page." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/style.css" />
  </head>

  <body>
    <!-- Paper grain. Decorative. -->
    <div class="grain" aria-hidden="true"></div>

    <header class="masthead">
      <h1 class="wordmark" data-copy="brand.name">flite-rs</h1>
      <p class="standfirst" data-copy="brand.standfirst">
        A speech synthesiser small enough to live inside a web page.
      </p>
      <nav class="links" data-links></nav>
    </header>

    <main>
      <!-- The waveform and the phones under it. This is the part that grows
           when there is room, so the page fills a screen without scrolling. -->
      <section class="strip" aria-label="Output">
        <div class="strip__head">
          <h2 class="strip__title" data-copy="labels.signal">Signal</h2>
          <div class="readout" data-readout>
            <span data-copy="labels.idle">nothing rendered yet</span>
          </div>
        </div>

        <div class="scope" data-scope>
          <canvas class="scope__canvas" data-waveform></canvas>
          <div class="scope__playhead" data-playhead hidden></div>
          <p class="scope__empty" data-scope-empty data-copy="labels.empty">
            Type something and press Speak.
          </p>
        </div>

        <div class="ruler" data-ruler aria-hidden="true"></div>

        <div class="phones" data-phones-wrap hidden>
          <div class="phones__track" data-phones></div>
        </div>
      </section>

      <div class="columns">
        <!-- What you say. -->
        <section class="panel" id="composer">
          <div class="panel__head">
            <h2 data-copy="labels.text">Text</h2>
            <div class="samples" data-samples></div>
          </div>

          <textarea
            class="composer"
            data-text
            spellcheck="false"
            rows="3"
            aria-label="Text to speak"
          ></textarea>

          <div class="actions">
            <button class="btn btn--primary" data-speak type="button">
              <span class="btn__glyph" aria-hidden="true"></span>
              <span data-copy="labels.speak">Speak</span>
            </button>
            <button class="btn" data-stop type="button" disabled data-copy="labels.stop">Stop</button>
            <button class="btn" data-download type="button" disabled data-copy="labels.download">
              Save WAV
            </button>
            <p class="hint">
              <kbd>Ctrl</kbd><kbd>Enter</kbd>
              <span data-copy="labels.hint">to render</span>
            </p>
          </div>

          <p class="status" data-status role="status" aria-live="polite"></p>
        </section>

        <!-- How it is said. -->
        <aside class="panel panel--instrument">
          <div class="panel__head">
            <h2 data-copy="labels.engine">Engine</h2>
          </div>

          <div class="engines" data-engines role="radiogroup" aria-label="Synthesis engine"></div>
          <p class="engine__note" data-engine-note></p>

          <div class="dials">
            <label class="dial">
              <span class="dial__name" data-copy="labels.rate">Rate</span>
              <input type="range" data-rate min="0.5" max="2" step="0.01" value="1" />
              <output class="dial__value" data-rate-out>1.00</output>
            </label>

            <label class="dial">
              <span class="dial__name" data-copy="labels.pitch">Pitch</span>
              <input type="range" data-pitch min="0.6" max="1.6" step="0.01" value="1" />
              <output class="dial__value" data-pitch-out>1.00</output>
            </label>
          </div>
        </aside>
      </div>
    </main>

    <footer class="footer">
      <p data-copy="brand.note"></p>
      <p class="footer__build" data-footer-build></p>
    </footer>

    <script type="module" src="assets/app.js"></script>
  </body>
</html>
